name: Weather snapshot

# Every 3 hours: fetch the latest METARs from aviationweather.gov, write src/data/weather.json,
# commit it, and start the deploy workflow so the site is rebuilt with the new snapshot.
# (A push made with the built-in token does not trigger other workflows, hence the explicit dispatch.)

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weather-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch METARs
        run: node scripts/fetch-metar.mjs

      - name: Commit the snapshot and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/weather.json; then
            echo "No new reports. Nothing to commit."
            exit 0
          fi
          git config user.name "Franco Caccia"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add src/data/weather.json
          git commit -m "Weather snapshot: latest METARs for SABE and KABE"
          git push
          gh workflow run deploy.yml --ref main
